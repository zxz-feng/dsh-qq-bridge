# ============================================================================
# dsh-qq-bridge —— 插件自带的挂载声明
# ============================================================================
# 装上之后，profile 只要在 dsh.profile.bundles 里列出本包名即生效
# （`dsh plugin --profile web add <本包>` 会自动写进去）。
#
# ⚠️ 默认 enabled: true 但**白名单是空的** = 谁都不回。要真用，先配
#    allowlist.json（self + friends）和 OneBot 地址。
# ⚠️ NapCat 是外部依赖，不在插件里。
# ============================================================================

- insert:
    - id: qq-bridge
      name: dsh-qq-bridge
      config:
        enabled: true
